    <!-- 上面这条是 light 配色：assets/mark-light.svg -->
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64' fill='none' role='img' aria-labelledby='mpmark-title'><title id='mpmark-title'>MarkPic</title><defs><linearGradient id='mpmark-tile' x1='14' y1='2' x2='50' y2='62' gradientUnits='userSpaceOnUse'><stop stop-color='%23263750'/><stop offset='.52' stop-color='%23101826'/><stop offset='1' stop-color='%23080d16'/></linearGradient><linearGradient id='mpmark-ridge' x1='15' y1='46' x2='51' y2='20' gradientUnits='userSpaceOnUse'><stop stop-color='%231f8fa6'/><stop offset='.52' stop-color='%235fd9c9'/><stop offset='1' stop-color='%23e9fffb'/></linearGradient><radialGradient id='mpmark-glow' cx='46.6' cy='14.4' r='26' gradientUnits='userSpaceOnUse'><stop stop-color='%23ffd9a8' stop-opacity='.14'/><stop offset='.55' stop-color='%235fd9c9' stop-opacity='.07'/><stop offset='1' stop-color='%235fd9c9' stop-opacity='0'/></radialGradient></defs><rect x='2' y='2' width='60' height='60' rx='15.5' fill='url(%23mpmark-tile)'/><rect x='2' y='2' width='60' height='60' rx='15.5' fill='url(%23mpmark-glow)'/><circle cx='46.6' cy='14.4' r='3.2' fill='%23ffd9a8'/><path d='M15 46V30.6C15 25.5 18.9 20.4 24 20.4C29.1 20.4 32.5 25.5 32.5 30.6V46M32.5 30.6C32.5 25.6 36.4 21.6 41.2 21.6C46 21.6 50 25.6 50 30.6V46' stroke='url(%23mpmark-ridge)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/><rect x='2.5' y='2.5' width='59' height='59' rx='15' stroke='%23fff' stroke-opacity='.08'/></svg>" />
    <!-- 上面这条是 dark 配色：assets/mark-dark.svg -->
    <!-- favicon:end -->
    <title>MarkPic</title>
    <script>
      ;(function () {
        try {
          // 首屏防闪：在 Vue 挂载前先把主题定下来。新键优先，旧键（改名前的）也能读，
          // 免得老用户已经选好的主题在升级后闪一下再跳回来。
          var stored = localStorage.getItem('markpic.theme')
          if (stored !== 'light' && stored !== 'dark') {
            stored = localStorage.getItem('convert-md-picture.theme')
          }
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <!-- 首屏防闪：Vue 还没挂载、甚至 CSS 还没到的时候，窗口里至少要有底色
         和一块版心骨架。否则用户先看见 WebView2 的白板，再看见深色背景，最后
         才看见内容 —— 三道闪。这段样式故意写在这里，不进 main.css：它必须
         比打包出来的样式表更早生效。 -->
    <style>
      html {
        height: 100%;
        background: #eef1f6;
      }
      html[data-theme='dark'] {
        background: #0b0e14;
      }
      body {
        height: 100%;
        margin: 0;
        background: inherit;
      }
      #app {
        height: 100%;
      }
      .boot {
        --boot-line: rgba(17, 26, 43, 0.1);
        --boot-panel: #ffffff;
        --boot-ink: rgba(17, 26, 43, 0.12);
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr);
        height: 100%;
        padding: 0 20px;
        box-sizing: border-box;
      }
      html[data-theme='dark'] .boot {
        --boot-line: rgba(255, 255, 255, 0.08);
        --boot-panel: #12161f;
        --boot-ink: rgba(255, 255, 255, 0.1);
      }
      .boot__bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
      }
      .boot__mark {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--boot-ink);
      }
      .boot__word {
        width: 74px;
        height: 13px;
        border-radius: 4px;
        background: var(--boot-ink);
      }
      .boot__spacer {
        flex: 1;
      }
      .boot__pill {
        width: 104px;
        height: 24px;
        border: 1px solid var(--boot-line);
        border-radius: 999px;
      }
      .boot__btn {
        width: 40px;
        height: 26px;
        border-radius: 7px;
        background: var(--boot-ink);
        opacity: 0.5;
      }
      .boot__body {
        display: grid;
        grid-template-columns: 168px minmax(0, 1fr);
        gap: 12px;
        min-height: 0;
        padding-bottom: 14px;
      }
      .boot__rail {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 6px;
      }
      .boot__nav {
        height: 36px;
        border-radius: 9px;
        background: var(--boot-ink);
        opacity: 0.55;
      }
      .boot__nav--on {
        background: rgba(15, 127, 120, 0.22);
        opacity: 1;
      }
      .boot__stage {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .boot__card {
        flex: 1;
        padding: 18px 20px;
        border: 1px solid var(--boot-line);
        border-radius: 14px;
        background: var(--boot-panel);
      }
      .boot__line {
        display: block;
        height: 14px;
        border-radius: 4px;
        background: var(--boot-ink);
      }
      .boot__line--title {
        width: 190px;
        height: 20px;
      }
      .boot__line--sub {
        width: 130px;
        margin-top: 10px;
        opacity: 0.6;
      }
      .boot__row {
        height: 64px;
        margin-top: 18px;
        border: 1px solid var(--boot-line);
        border-radius: 12px;
      }
    </style>
    <script defer src="./assets/index-BtKDWamb.js"></script>
  </head>
  <body>
    <!-- Vue 挂载后整块骨架会被替换掉，它只活到第一帧。 -->
    <div id="app">
      <div class="boot" aria-hidden="true">
        <div class="boot__bar">
          <span class="boot__mark"></span>
          <span class="boot__word"></span>
          <span class="boot__spacer"></span>
          <span class="boot__pill"></span>
          <span class="boot__btn"></span>
          <span class="boot__btn"></span>
        </div>
        <div class="boot__body">
          <div class="boot__rail">
            <span class="boot__nav boot__nav--on"></span>
            <span class="boot__nav"></span>
            <span class="boot__nav"></span>
            <span class="boot__nav"></span>
          </div>
          <div class="boot__stage">
            <div class="boot__card">
              <span class="boot__line boot__line--title"></span>
              <span class="boot__line boot__line--sub"></span>
              <div class="boot__row"></div>
              <div class="boot__row"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
