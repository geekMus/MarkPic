# 推送到 main 后自动构建并发版。规则：
#   - 版本号就是发布当天的日期（CalVer，Asia/Shanghai）：2026.11.14；
#     同一天再推一次自动顺延成 2026.11.14.1、2026.11.14.2……
#   - 提交信息里带 [no-release] 的推送只跑检查、不发版；
#   - Release 记录按提交主题前缀分组：界面/资源 → 新功能，改进/重构/更名 → 改进，修复 → 修复，其余 → 其他；
#   - 顺序铁律：先把 exe 传上 release，再把 version.json 推回 main——老版本不能在下载地址
#     还不存在时看到「有新版本」；
#   - 只有 main 分支会发布：push 只监听 main，手动触发（workflow_dispatch）也被 job 级 if 拦下。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 按日期定版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 按日期算版本号（同一天第二次发布自动加序号）
        id: ver
        run: |
          base=$(TZ=Asia/Shanghai date +%Y.%m.%d)
          v="$base"
          n=0
          while git rev-parse -q --verify "refs/tags/v$v" >/dev/null 2>&1; do
            n=$((n + 1))
            v="$base.$n"
          done
          if ! [[ "$v" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::算出来的版本号（$v）不是日期格式"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "本次发布：v$v"

  release:
    name: 构建并发布
    needs: prepare
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-release]')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Release 记录需要完整历史
          fetch-tags: true # 用上一个 tag 圈定记录范围

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm --dir web install --frozen-lockfile

      - name: 重建前端、跑测试、编译 exe
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/build.mjs --web --test --version $env:VERSION --output "bin/MarkPic-v$env:VERSION-windows-amd64.exe"

      - name: 生成 Release 记录
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $v = $env:VERSION
          $prev = "$(git describe --tags --abbrev=0 HEAD 2>$null)".Trim()
          $subjects = if ($prev) { git log --format='%s' "$prev..HEAD" } else { git log --format='%s' }

          $groups = [ordered]@{
            '新功能' = [System.Collections.Generic.List[string]]::new()
            '改进'   = [System.Collections.Generic.List[string]]::new()
            '修复'   = [System.Collections.Generic.List[string]]::new()
            '其他'   = [System.Collections.Generic.List[string]]::new()
          }
          foreach ($s in $subjects) {
            $t = "$s".Trim()
            if (-not $t -or $t -match '^release v\d') { continue }
            if     ($t -match '^(界面|资源)[：:]')      { $groups['新功能'].Add($t) }
            elseif ($t -match '^(改进|重构|更名)[：:]')  { $groups['改进'].Add($t) }
            elseif ($t -match '^修复[：:]')             { $groups['修复'].Add($t) }
            else                                        { $groups['其他'].Add($t) }
          }

          $now = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'China Standard Time')
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("## v$v（$($now.ToString('yyyy-MM-dd'))）")
          $icons = @{ '新功能' = '✨'; '改进' = '🔧'; '修复' = '🐛'; '其他' = '📝' }
          foreach ($key in $groups.Keys) {
            if ($groups[$key].Count -eq 0) { continue }
            $lines.Add('')
            $lines.Add("### $($icons[$key]) $key")
            foreach ($item in $groups[$key]) { $lines.Add("- $item") }
          }
          if ($lines.Count -eq 1) {
            $lines.Add('')
            $lines.Add('维护性更新。')
          }
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/notes.md", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))

          if (-not $prev) {
            $oneLine = '首个版本。'
          } else {
            $oneLine = "本次更新：新功能 $($groups['新功能'].Count) 项，改进 $($groups['改进'].Count) 项，修复 $($groups['修复'].Count) 项。"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes=$oneLine" -Encoding utf8

      - name: 创建 release 并上传 exe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $v = $env:VERSION
          gh release create "v$v" "bin/MarkPic-v$v-windows-amd64.exe" --title "v$v" --notes-file notes.md --target "$env:GITHUB_SHA"

      - name: 回写 version.json 并推回 main
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          $v = $env:VERSION
          $tag = "v$v"
          $asset = "MarkPic-v$v-windows-amd64.exe"
          $sha = (Get-FileHash -Algorithm SHA256 "bin/$asset").Hash.ToLower()
          $size = (Get-Item "bin/$asset").Length
          $now = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'China Standard Time')
          $manifest = [ordered]@{
            version   = $v
            tag       = $tag
            published = $now.ToString('yyyy-MM-dd')
            notes     = $env:NOTES
            windows   = [ordered]@{
              amd64 = [ordered]@{
                url    = "https://github.com/geekMus/MarkPic/releases/download/$tag/$asset"
                sha256 = $sha
                size   = $size
              }
            }
          }
          $json = ($manifest | ConvertTo-Json -Depth 6) -replace "`r`n", "`n"
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/version.json", $json + "`n", [Text.UTF8Encoding]::new($false))

          # 前端重建可能让 internal/ui/dist 与提交不一致（本地忘了重建时），恢复成提交的内容，保持工作树干净。
          git checkout -- internal/ui/dist
          git clean -fd internal/ui/dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # package.json 的版本号跟着回到刚发的这一版（只换第一个 version 字段，避免整份重排）。
          $pkgPath = "$env:GITHUB_WORKSPACE/package.json"
          $pkgText = [IO.File]::ReadAllText($pkgPath)
          $pattern = [regex]'"version"\s*:\s*"[^"]*"'
          $pkgText = $pattern.Replace($pkgText, '"version": "' + $v + '"', 1)
          [IO.File]::WriteAllText($pkgPath, $pkgText, [Text.UTF8Encoding]::new($false))

          git add version.json package.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'version.json 与 package.json 都没变化，跳过推送。'
          }
          else {
            git commit -m "release $tag [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
