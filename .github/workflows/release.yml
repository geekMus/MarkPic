# 推送到 main 后自动构建并发布。
#
# 规则：
#   - 只有 main 会发版：push 只监听 main；手动触发（workflow_dispatch）在 prepare 的
#     job 级 if 里被拦下，其他分支和 PR 都走不到这里。
#   - 只有会进 exe 的路径才发版（cmd/ internal/ web/ scripts/ assets/ tools/ go.mod go.sum
#     package.json）；只动文档或 CI 配置的合并不发版，需要时用 workflow_dispatch 手动触发。
#   - 版本号就是发布当天的日期（CalVer，Asia/Shanghai）：2026.11.17；
#     同一天再推一次就顺延成 2026.11.17.1、2026.11.17.2……（靠 tag 探测，不落状态）。
#   - 提交信息里带 [no-release] 的推送：照常装依赖、构建前端、跑 Go 测试，但不建 release、
#     不推 version.json —— 相当于一条完整的 CI 检查。
#   - 目前只产出 Windows / amd64 一个安装包：MarkPic-v<版本>-windows-amd64.exe。
#   - 顺序铁律：先建草稿 release，把 exe 和 version.json 都传齐，最后才发布。老版本不能
#     在下载地址还不存在时就看到「有新版本」。
#   - 清单不再写回 main（main 只接受来自 dev 的合并，CI 推不进去），而是作为 release
#     附件上传；客户端读 releases/latest/download/version.json。
#
# 分层（与 PacPilot 的 workflow 同一套写法：每层一个 job，小结统一放在最后的 report job）：
#   阶段 1 prepare：算版本号、判断这次要不要发
#   阶段 2 build  ：装依赖 → 构建前端 → Go 测试 → 编译 exe → 上传 artifact
#   阶段 3 publish：生成更新说明 → 生成版本清单 → 建草稿 → 传 exe 与清单 → 发布
#   阶段 4 report ：汇总各阶段结果
name: 构建并发布

on:
  push:
    branches:
      - main
    # 只有会进 exe 的路径才发版：只动文档、README、.github 的合并不再给用户推一版。
    # 需要在这种情况下也发一版，用 workflow_dispatch 手动触发（同样只能在 main 上跑）。
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'scripts/**'
      - 'assets/**'
      - 'tools/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
  workflow_dispatch:

env:
  # 时区集中配置：换发版日历只改这里。
  RELEASE_TIMEZONE: Asia/Shanghai
  # 产物前缀，发布时拼成 <前缀>-v<版本>-windows-amd64.exe。
  ASSET_PREFIX: MarkPic

# 同一工作流、同一 ref 只保留一条；发版要串行写版本号，所以不取消正在跑的那条。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 默认只读，写权限只在真正要推回 main 的那个 job 上开。
permissions:
  contents: read

jobs:
  prepare:
    name: 计算版本号
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}
      publish: ${{ steps.version.outputs.publish }}
      reason: ${{ steps.version.outputs.reason }}
    steps:
      - name: 检出 main 历史与全部标签
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 按日期算版本号并判断是否发布
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(TZ="$RELEASE_TIMEZONE" date +%Y.%m.%d)"
          VERSION="$BASE"
          N=0
          while git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null 2>&1; do
            N=$((N + 1))
            VERSION="$BASE.$N"
          done

          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::算出来的版本号（$VERSION）不是日期格式"
            exit 1
          fi

          # 只看提交标题：正文里引用这个标记（写提交说明、写文档时）不该让发布被跳过。
          SUBJECT="$(git log -1 --format='%s')"
          if [[ "$SUBJECT" == *"[no-release]"* ]]; then
            PUBLISH="false"
            REASON="提交信息里带 [no-release]：这次只构建、只跑测试，不发版。"
          else
            PUBLISH="true"
            REASON="准备发布 v$VERSION。"
          fi

          ASSET="${ASSET_PREFIX}-v${VERSION}-windows-amd64.exe"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "asset=$ASSET"
            echo "publish=$PUBLISH"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

          echo "发布时区：$RELEASE_TIMEZONE"
          echo "本次版本：v$VERSION"
          echo "产物名称：$ASSET"
          echo "发布判断：$REASON"

  build:
    name: 构建安装包
    needs: prepare
    if: needs.prepare.outputs.publish != ''
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码（完整历史：Release 记录要用上一个 tag 圈范围）
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 安装 pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: 安装 Node
        id: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 记录构建环境
        id: env
        run: |
          Write-Host "PowerShell：$($PSVersionTable.PSVersion)"
          Write-Host "Node：$(node --version)"
          Write-Host "pnpm：$(pnpm --version)"
          Write-Host "Go：$(go version)"
          # 记一下系统 ANSI 代码页，失败时好对照现场；GBK 相关用例会把代码页钉成 936，
          # 所以这个值不影响测试覆盖面。
          $acp = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage').ACP
          Write-Host "系统 ANSI 代码页（ACP）：$acp"

      - name: 安装前端依赖
        id: install
        run: pnpm --dir web install --frozen-lockfile

      - name: 构建前端（vue-tsc + vite → internal/ui/dist）
        id: web
        run: node scripts/web.mjs

      - name: 跑 Go 测试
        id: tests
        run: node scripts/test.mjs --pattern ./...

      - name: 编译 exe
        id: build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          node scripts/build.mjs --no-web --version $env:VERSION --output "bin/$($env:ASSET)"

      - name: 校验产物并记录摘要
        id: verify
        env:
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: |
          $path = "bin/$($env:ASSET)"
          if (-not (Test-Path -LiteralPath $path)) {
            Write-Host "::error::没有生成 $path"
            exit 1
          }
          $item = Get-Item -LiteralPath $path
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLower()
          Write-Host ("产物：{0}（{1:N1} MB）" -f $item.Name, ($item.Length / 1MB))
          Write-Host "SHA256：$hash"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size=$($item.Length)" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$hash" -Encoding utf8

      - name: 上传安装包给发布阶段
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-amd64-exe
          path: bin/${{ needs.prepare.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 发布 Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 检出 main（完整历史）
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Node（生成更新说明要用）
        id: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 下载构建阶段上传的安装包
        id: download
        uses: actions/download-artifact@v8
        with:
          name: windows-amd64-exe
          path: bin

      - name: 生成更新说明
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET: ${{ needs.prepare.outputs.asset }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "bin/$ASSET" | cut -d' ' -f1)"
          # 更新说明由 scripts/release-notes.mjs 生成；本地可以先预览：
          #   node scripts/release-notes.mjs --version 2026.11.17 --dry-run
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --repo "$REPOSITORY" \
            --asset "$ASSET" \
            --sha256 "$SHA" \
            --out "$RUNNER_TEMP/notes.md" \
            --github-output
          echo "----------------------------------------"
          cat "$RUNNER_TEMP/notes.md"
          echo "----------------------------------------"

      - name: 生成版本清单
        id: manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ needs.prepare.outputs.asset }}
          ONELINE: ${{ steps.notes.outputs.oneline }}
          REPOSITORY: ${{ github.repository }}
          TIMEZONE: ${{ env.RELEASE_TIMEZONE }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED="$(TZ="$TIMEZONE" date +%Y-%m-%d)"
          SHA="$(sha256sum "bin/$ASSET" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "bin/$ASSET")"
          URL="https://github.com/$REPOSITORY/releases/download/$TAG/$ASSET"

          mkdir -p "$RUNNER_TEMP/manifest"
          # notes 是给「有新版本」那一行看的一句话摘要；notesBody 是整篇更新说明
          # ——程序里的「更新说明」对话框读的是它，不用再连一次 GitHub。
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg published "$PUBLISHED" \
            --arg notes "$ONELINE" \
            --rawfile notesBody "$RUNNER_TEMP/notes.md" \
            --arg url "$URL" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            '{version: $version, tag: $tag, published: $published, notes: $notes,
              notesBody: $notesBody,
              windows: {amd64: {url: $url, sha256: $sha256, size: $size}}}' \
            > "$RUNNER_TEMP/manifest/version.json"

          echo "version.json（随 release 一起发布）："
          cat "$RUNNER_TEMP/manifest/version.json"

      - name: 建草稿 release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # 草稿不会被 releases/latest 选中：等 exe 和清单都传齐再发布，
          # 客户端就不可能看到「清单已在、包还没上传」的中间状态。
          gh release create "$TAG" --draft \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"

      - name: 上传 exe 与清单并发布
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ needs.prepare.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "bin/$ASSET" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/manifest/version.json" --clobber
          gh release edit "$TAG" --draft=false
          echo "已发布 $TAG（exe + version.json）"

  report:
    name: 汇总结果
    needs: [prepare, build, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总各阶段结果
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          REASON: ${{ needs.prepare.outputs.reason }}
        shell: bash
        run: |
          {
            echo "## 阶段 4：汇总"
            echo
            echo "- **阶段 1（版本号）：** ${PREPARE_RESULT:-未执行}"
            echo "- **阶段 2（构建）：** ${BUILD_RESULT:-未执行}"
            echo "- **阶段 3（发布）：** ${PUBLISH_RESULT:-未执行}"
            echo "- **目标版本：** ${VERSION:+v}${VERSION:-未确定}"
            if [[ "${PUBLISH:-}" == "false" ]]; then
              echo "- **结论：** 本次只构建不发布。${REASON:-}"
            elif [[ "${BUILD_RESULT:-}" == "success" && "${PUBLISH_RESULT:-}" == "success" ]]; then
              echo "- **结论：** v${VERSION} 已发布，version.json 已推回 main。"
            elif [[ "${BUILD_RESULT:-}" == "success" ]]; then
              echo "- **结论：** 构建通过但没有完成发布，请看阶段 3。"
            else
              echo "- **结论：** 构建未通过，没有产生 release。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
