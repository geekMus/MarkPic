# 把 main 同步回 dev。
#
# 为什么需要它：发版流水线会往 main 推一条「release v<版本> [skip ci]」的版本号回写提交，
# dev 不跟上就会越拉越远，下次从 dev 合回 main 时又把旧版本号带回来。
#
# 触发：
#   - push 到 main：日常提交直接推 main 时同步；
#   - main 上的 PR 关闭（合并）：走 PR 流程时同步；
#   - 「构建并发布」跑完：发版已经不再往 main 写提交，这一条现在是冗余的兜底，
#     留着是为了将来万一又有 CI 提交时仍能同步；
#   - workflow_dispatch：手动补一次。
#
# 只做「合并 + 可重试」：dev 已经包含 main 就什么都不做；有冲突就红着报错，不猜。
name: 同步 main 到 dev

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_run:
    workflows:
      - 构建并发布
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 同一工作流、同一 ref 只保留一条；同步要串行，不能互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 main 到 dev
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出 dev 历史
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 将 main 合并进 dev 并推送
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
              git fetch origin dev
              git checkout -B dev origin/dev
            else
              echo "远程还没有 dev 分支：从 main 建一个。"
              git checkout -B dev origin/main
              git push origin HEAD:refs/heads/dev
              echo "created=true" >> "$GITHUB_OUTPUT"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "同步状态：dev 已包含最新 main，无需更新。"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              echo "::error::无法自动把 main 合并进 dev（存在冲突），请检查分支后手动处理。"
              exit 1
            fi

            if git push origin HEAD:refs/heads/dev; then
              echo "同步状态：已把最新 main 合并并推送到 dev。"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "推送 dev 失败（尝试 $attempt/3），重新拉取分支后重试。"
            if [[ "$attempt" == "3" ]]; then
              echo "::error::多次尝试后仍无法推送 dev；可能有并发提交，请手动同步。"
              exit 1
            fi
          done

      - name: 阶段 1 小结
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
          SYNC_CREATED: ${{ steps.sync.outputs.created }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          {
            echo "## 阶段 1：同步 main 到 dev"
            echo
            echo "- **结果：** ${JOB_STATUS:-未知}"
            echo "- **触发事件：** ${EVENT_NAME:-未知}"
            if [[ "${SYNC_CREATED:-}" == "true" ]]; then
              echo "- **同步状态：** 远程原本没有 dev，已从 main 建出 dev"
            elif [[ "${SYNC_CHANGED:-}" == "true" ]]; then
              echo "- **同步状态：** 已把 main 合并并推送到 dev"
            elif [[ "${SYNC_CHANGED:-}" == "false" ]]; then
              echo "- **同步状态：** dev 已包含最新 main，没有产生新提交"
            else
              echo "- **同步状态：** 未完成，请查看上方日志"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
