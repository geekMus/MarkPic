<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Crect x='1.5' y='1.5' width='21' height='21' rx='6.5' fill='%2310161f'/%3E%3Crect x='5.4' y='6.8' width='13.2' height='10.4' rx='2.6' stroke='%234fd1e0' stroke-width='1.55' fill='none'/%3E%3Ccircle cx='9' cy='10.2' r='1.25' fill='%234fd1e0'/%3E%3Cpath d='M7 15.7 10.1 12.5 11.9 14.2 13.3 12.8 16.8 15.8' stroke='%234fd1e0' stroke-width='1.55' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <title>MarkPic</title>
    <script>
      ;(function () {
        try {
          // 首屏防闪：在 Vue 挂载前先把主题定下来。新键优先，旧键（改名前的）也能读，
          // 免得老用户已经选好的主题在升级后闪一下再跳回来。
          var stored = localStorage.getItem('markpic.theme')
          if (stored !== 'light' && stored !== 'dark') {
            stored = localStorage.getItem('convert-md-picture.theme')
          }
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
